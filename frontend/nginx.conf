resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Variable upstreams re-resolve via Docker DNS after container recreate (avoids stale 502).
  set $upstream_api api:8000;
  set $upstream_market market-stream:8000;

  location /api/research/ {
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;
  }

  location /api/ {
    proxy_pass http://$upstream_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # Fan-out market stream (public Binance klines) — visualization only
  location /ws/ {
    proxy_pass http://$upstream_market;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /api/market/ {
    proxy_pass http://$upstream_market;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
