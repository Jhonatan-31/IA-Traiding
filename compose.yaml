services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - paper_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      retries: 15
      timeout: 4s
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      SCAN_LIMIT: ${SCAN_LIMIT:-25}
      SCAN_EVERY_SECONDS: ${SCAN_EVERY_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    depends_on: [api]
volumes:
  paper_data:
