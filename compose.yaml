services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paper
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - paper_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper"]
      interval: 5s
      retries: 15
      timeout: 4s
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      ML_ARTIFACT_DIR: /artifacts
      LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:-paper}
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      SCAN_LIMIT: ${SCAN_LIMIT:-25}
      SCAN_EVERY_SECONDS: ${SCAN_EVERY_SECONDS:-3600}
      ML_ARTIFACT_DIR: /artifacts
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
  dashboard:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    depends_on: [api]
  shadow-scheduler:
    build: ./backend
    command: ["python", "-m", "app.prospect.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      ML_ARTIFACT_DIR: /artifacts
      SHADOW_EVERY_SECONDS: ${SHADOW_EVERY_SECONDS:-300}
      TZ: UTC
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
  trade-executor:
    build: ./backend
    command: ["python", "-m", "app.lab.runner"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      ML_ARTIFACT_DIR: /artifacts
      LAB_EVERY_SECONDS: ${LAB_EVERY_SECONDS:-300}
      LAB_CONTROL_TOKEN: ${LAB_CONTROL_TOKEN:-paper}
      TZ: UTC
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
  ml-train:
    build: ./backend
    profiles: ["ml"]
    command: ["python", "-m", "app.ml.job"]
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      ML_ARTIFACT_DIR: /artifacts
      ML_INTERVAL: ${ML_INTERVAL:-1h}
      ML_MAX_BARS: ${ML_MAX_BARS:-800}
      ML_SYMBOLS: ${ML_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,ATOMUSDT,NEARUSDT,UNIUSDT,AAVEUSDT}
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  ml-research:
    build: ./backend
    profiles: ["ml"]
    command: ["python", "-m", "app.ml.research_job"]
    environment:
      DATABASE_URL: postgresql://paper:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/paper
      ML_ARTIFACT_DIR: /artifacts
      ML_INTERVAL: ${ML_INTERVAL:-1h}
      ML_MAX_BARS: ${ML_MAX_BARS:-1500}
      ML_SYMBOLS: ${ML_SYMBOLS:-BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,LTCUSDT,ATOMUSDT,NEARUSDT,UNIUSDT,AAVEUSDT}
    volumes:
      - ml_artifacts:/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  paper_data:
  ml_artifacts:
